<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Κομμωτήριο</title>
  <meta name="description" content="Test Κομμωτήριο: κλείστε ραντεβού online.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="intro">
      <h1>Test Κομμωτήριο</h1>
      <p>Κούρεμα, βαφή και χτένισμα στη γειτονιά σας. Αφήστε μας το όνομα και το τηλέφωνό σας και θα σας καλέσουμε για να κλείσουμε μαζί την ώρα που σας βολεύει.</p>
    </section>

    <section class="booking" aria-labelledby="booking-title">
      <h2 id="booking-title">Κλείστε ραντεβού</h2>
      <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="572dae94-bc1f-4a1f-9d23-8335d4de2eca">
        <input type="hidden" name="redirect" value="https://test-komotirio.netlify.app/thanks.html">
        <input type="checkbox" name="botcheck" class="botcheck" tabindex="-1" autocomplete="off">

        <div class="field">
          <label for="name">Όνομα</label>
          <input id="name" name="Όνομα"type="text" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="phone">Τηλέφωνο</label>
          <input id="phone" name="Τηλέφωνο"type="tel" inputmode="tel" autocomplete="tel" required>
        </div>

        <div class="field">
          <label for="message">Μήνυμα</label>
          <textarea id="message" name="Μήνυμα"placeholder="π.χ. κούρεμα, Σάββατο πρωί"></textarea>
        </div>

        <button type="submit">Αποστολή κράτησης</button>
      </form>
    </section>
  </main>
</body>
</html>
